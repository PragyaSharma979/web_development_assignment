<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimateX</title>
    
   
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .hero-section {
            position: relative;
            width: 100%;
            height: 70vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('image1.jpg') no-repeat center center/cover;
            transition: background 1s ease-in-out;
        }

        .content {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px 40px;
            border-radius: 8px;
        }

        .content h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .content p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .content button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .content button:hover {
            background-color: #0056b3;
           
        }
    </style>
</head>
<body>

    <header class="hero-section" <img src="https://plantsguru.com/cdn/shop/files/Rose_Baby_Pink.jpg?v=1758804477">>
        <div class="content">
            <h1>Explore the World</h1>
            <p>Bring your website to life.</p>
            <button>Discover More</button>
        </div>
    </header>

</body>
</html>
