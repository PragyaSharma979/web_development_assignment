<!DOCTYPE html>
<html lang="en">
<head>
    <title>keyboard making</title>
    <style>
        #container{
            display: grid;
            border: 1px solid pink ;
            grid-template-columns: repeat(12,1fr);
            background-color:black;
            color: white;
            margin-top: 90px;
            gap: 10px;
            height: 300px;
            width:900px;
            padding: 20px;
            margin-left: 100px;
        }

        #container>div{
            display: grid;
            border: 1px solid pink;
            padding:10px;
            
        }
        #container>div:nth-child(51){
            grid-area: 5/3/5/7; }

        #container>div:nth-child(35){
            grid-area:3/11/3/13;}
            #container>div:nth-child(46){
            grid-area:4/11/4/13;}



        
    </style>
</head>
