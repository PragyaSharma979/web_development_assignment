<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Grid</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #container {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            grid-template-rows: repeat(5, 70px);
            gap: 10px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            grid-template-areas: 
                "disp disp disp disp"
                "n1 n2 n3 plus"
                "n4 n5 n6 minus"
                "n7 n8 n9 multi"
                "clr n0 eq div";
        }

        #container div {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid #ddd;
            background-color: #ffffff;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
        }

        #container div:hover {
            opacity: 0.8;
        }

        /* Grid Areas Mapping */
        .display { grid-area: disp; background-color: #f9f9f9; }
        
        .key1 { grid-area: n1; }
        .key2 { grid-area: n2; }
        .key3 { grid-area: n3; }
        
        .plus, .minus, .multi, .divide, .equals {
            background-color: #000000;
            color: #ffffff;
            border-color: #000000;
        }

        .plus { grid-area: plus;
        color:black; }
        
        .key4 { grid-area: n4; }
        .key5 { grid-area: n5; }
        .key6 { grid-area: n6; }
        .minus { grid-area: minus;
        color: #000000; }
        
        .key7 { grid-area: n7; }
        .key8 { grid-area: n8; }
        .key9 { grid-area: n9; }
        .multi { grid-area: multi;
        color: #000000; }
        
        .clear { 
            grid-area: clr;  
            color: crimson;
            
        }
        
        .key0 { grid-area: n0;
        color: #000000; }
        .equals { grid-area: eq;
        color: #000000; }
        .divide { grid-area: div;
        color: #000000; }
    </style>
</head>
<body>

    <div id="container">
        <div class="display"></div>
        <div class="key1">1</div>
        <div class="key2">2</div>
        <div class="key3">3</div>
        <div class="plus">+</div>
        <div class="key4">4</div>
        <div class="key5">5</div>
        <div class="key6">6</div>
        <div class="minus">-</div>
        <div class="key7">7</div>
        <div class="key8">8</div>
        <div class="key9">9</div>
        <div class="multi">x</div>
        <div class="clear">C</div>
        <div class="key0">0</div>
        <div class="equals">=</div>
        <div class="divide">/</div>
    </div>

</body>
</html>
