<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <style>
        *{
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            padding:20px;
        }
        /* Base Container using CSS Grid */
        .container{
            display: grid;
            gap:15px;
        }
        /* Common styling for boxes */
        .nav{
            background-color: yellow;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            text-align: left;  
        }
        .box{
            padding: 40px;
            color: rgb(73, 136, 59);
            font-size: 20px;
            font-weight: bold;
            min-height: 150px;
            border: 1px solid black;
        }
        .box1{background-color: pink;}
        .box2{background-color: rgb(37, 29, 117);}
        .box3{background-color: greenyellow;}
        .box4{background-color: rgb(144, 113, 118);}
        .box5{background-color: seagreen;}
        .box6{background-color: rgb(95, 95, 10);}
        .box7{background-color: rgb(130, 110, 128);}
        .box8{background-color: rgb(39, 38, 39);}
        .box9{background-color: rgb(251, 3, 3);}

        /*==================================================
               1. Large Screen Layout (> 1024px)
        ==================================================== */
        @media screen and (min-width:1024px) {.container
                {display: grid;
                grid-template-columns: repeat(9,1fr);} 
            .nav{grid-column:span 9; }}

        /*==================================================
             2. Medium Screen Layout (601px-1023px)
        ==================================================== */
        @media screen and (min-width:601px) and (max-width:1023px)
         {.container
                {display: grid;
                grid-template-columns: repeat(2,1fr);} 
            .nav{grid-column:span 2; }}
            /*==================================================
             3. Small Screen Layout (<= 600px)
            ==================================================== */
        @media screen and (max-width:600px) 
         {.container
                {display: grid;
                grid-template-columns: 1fr;} 
            .nav{grid-column:span 1; }}


    </style>

</head>
<body>
    <div class="container">
        <div class="nav">Navigation</div> 
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
        <div class="box box4">Box 4</div>
        <div class="box box5">Box 5</div>
        <div class="box box6">Box 6</div>
        <div class="box box7">Box 7</div>
        <div class="box box8">Box 8</div>
        <div class="box box9">Box 9</div>
    </div>
</body>
</html>
