<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms & Suites</title>

    <style>
        /* Universal Selector */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Element Selector */
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            padding: 50px 30px;
        }

        h1, h2, p {
            margin-bottom: 15px;
        }

        /* Main Section */
        #rooms-section {
            max-width: 1150px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            color: #222222;
            margin-bottom: 15px;
        }

        .description {
            text-align: center;
            color: #777777;
            font-size: 16px;
            line-height: 1.7;
            max-width: 750px;
            margin: 0 auto 40px;
        }

        /* Three-column layout */
        .rooms-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        /* Room Card */
        .room-card {
            background-color: #ffffff;
            border: 1px solid #eeeeee;
            border-radius: 5px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.10);
            transition: transform 0.3s;
        }

        .room-card:hover {
            transform: translateY(-5px);
        }

        /* Room Images */
        .room-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .room-info {
            padding: 25px 15px 30px;
        }

        .room-info h2 {
            font-size: 23px;
            color: #222222;
            margin-bottom: 15px;
        }

        .price {
            color: #c49b63;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .per-night {
            color: #888888;
            font-size: 12px;
            letter-spacing: 1.5px;
        }

        /* Grouping Selector */
        h1, h2 {
            font-weight: 600;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .rooms-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 15px;
            }

            h1 {
                font-size: 29px;
            }

            .rooms-container {
                grid-template-columns: 1fr;
            }

            .room-card img {
                height: 230px;
            }
        }
    </style>
</head>

<body>

    <section id="rooms-section">

        <h1>Rooms &amp; Suites</h1>

        <p class="description">
            Discover comfort and elegance in our thoughtfully designed rooms
            and suites. Whether you are travelling alone or with family,
            we have the perfect space for your stay.
        </p>

        <div class="rooms-container">

            <!-- Single Room -->
            <div class="room-card">
                <img
                    src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=800&q=80"
                    alt="Single Room">

                <div class="room-info">
                    <h2>Single Room</h2>
                    <p class="price">$90</p>
                    <p class="per-night">PER NIGHT</p>
                </div>
            </div>

            <!-- Family Room -->
            <div class="room-card">
                <img
                    src="https://images.unsplash.com/photo-1566665797739-1674de7a421a?auto=format&fit=crop&w=800&q=80"
                    alt="Family Room">

                <div class="room-info">
                    <h2>Family Room</h2>
                    <p class="price">$120</p>
                    <p class="per-night">PER NIGHT</p>
                </div>
            </div>

            <!-- Presidential Room -->
            <div class="room-card">
                <img
                    src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=800&q=80"
                    alt="Presidential Room">

                <div class="room-info">
                    <h2>Presidential Room</h2>
                    <p class="price">$250</p>
                    <p class="per-night">PER NIGHT</p>
                </div>
            </div>

        </div>

    </section>

</body>
</html>
